services:
  db:
    image: postgres:16-alpine
    container_name: weatherway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weatherway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weatherway}
      POSTGRES_DB: ${POSTGRES_DB:-weatherway}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weatherway} -d ${POSTGRES_DB:-weatherway}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
