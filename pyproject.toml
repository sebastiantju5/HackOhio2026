[project]
name = "hackohio2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aarush Katta", email = "arksealplays@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "blinker==1.9.0",
    "click==8.5.0",
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.4",
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "python-dotenv==1.2.4",
    "werkzeug==3.1.9",
]

[project.scripts]
hackohio2026 = "hackohio2026:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
